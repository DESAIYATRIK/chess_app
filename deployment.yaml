apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess
  template:
    metadata:
      labels:
        app: chess
    spec:
      containers:
      - name: chess-container
        image: yatrik1112/chess-app:latest
        ports:
        - containerPort: 5000